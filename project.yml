name: FlowerRescue
options:
  bundleIdPrefix: com.example.placeholder
  deploymentTarget:
    iOS: "16.0"
packages:
  FlowerRescueLocal:
    path: .
targets:
  FlowerRescue:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FlowerRescueLocal
        product: FlowerRescueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.placeholder.flowerrescue
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Flower Rescue"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
